name: Metadata Check

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  do_check:
    name: Check Metadata
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: assets/.python-version

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked
        working-directory: assets

      - name: Check metadata
        run: uv run metadata_check.py
        working-directory: assets
